schema_version: 1

context:
  version: "0.2.0"
  rev: 48997acb3f39780600d01dcc0c57d720d1664c8b

package:
  name: r-anicheck
  version: ${{ version }}

source:
  git: https://github.com/animovement/anicheck.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-aniframe
    - r-cli
    - r-rlang
  run:
    - r-base >=4.1.0
    - r-aniframe
    - r-cli
    - r-rlang

tests:
  - script:
      - Rscript -e "library(anicheck)"

about:
  homepage: https://github.com/animovement/anicheck
  summary: An R package for diagnosing movement data quality
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

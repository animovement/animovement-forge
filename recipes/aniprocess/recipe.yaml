schema_version: 1

context:
  version: "0.5.0.9000"
  rev: 843ce2b6b4ed5c47934c2cc8e7aa54c5af1e13b9

package:
  name: r-aniprocess
  version: ${{ version }}

source:
  git: https://github.com/animovement/aniprocess.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-anicore >=0.8.0
    - r-cli
    - r-data.table >=1.18.0
    - r-dplyr >=1.1.0
    - r-lifecycle
    - r-rlang
    - r-tidyselect
  run:
    - r-base >=4.1.0
    - r-anicore >=0.8.0
    - r-cli
    - r-data.table >=1.18.0
    - r-dplyr >=1.1.0
    - r-lifecycle
    - r-rlang
    - r-tidyselect

tests:
  - script:
      - Rscript -e "library(aniprocess)"

about:
  homepage: https://github.com/animovement/aniprocess
  summary: An R package for signal processing and filtering of movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

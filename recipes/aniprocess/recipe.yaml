schema_version: 1

context:
  version: "0.2.0.9000"
  rev: fa86e6cb63538db9618924a72c8bb67b39e72561

package:
  name: r-aniprocess
  version: ${{ version }}

source:
  git: https://github.com/animovement/aniprocess.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-aniframe
    - r-cli
    - r-data.table
    - r-dplyr
    - r-rlang
  run:
    - r-base >=4.1.0
    - r-aniframe
    - r-cli
    - r-data.table
    - r-dplyr
    - r-rlang

tests:
  - script:
      - Rscript -e "library(aniprocess)"

about:
  homepage: https://github.com/animovement/aniprocess
  summary: An R package for signal processing and filtering of movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

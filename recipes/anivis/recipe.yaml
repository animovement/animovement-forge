schema_version: 1

context:
  version: "0.2.1.9003"
  rev: 217954532d4a021c529a1b2a31c8545e539325ff

package:
  name: r-anivis
  version: ${{ version }}

source:
  git: https://github.com/animovement/anivis.git
  rev: ${{ rev }}

build:
  number: 1
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base
    - r-rlang
    - r-ggplot2 >=3.5.0
    - r-patchwork
    - r-marquee
    - r-hms
    - r-cli
    - r-lifecycle
    - r-anicore >=0.8.0.9004
  run:
    - r-base
    - r-rlang
    - r-ggplot2 >=3.5.0
    - r-patchwork
    - r-marquee
    - r-hms
    - r-cli
    - r-lifecycle
    - r-anicore >=0.8.0.9004

tests:
  - script:
      - Rscript -e "library(anivis)"

about:
  homepage: https://github.com/animovement/anivis
  summary: An R package for visualizing movement data and diagnostics
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

schema_version: 1

context:
  version: "0.3.0.9000"
  rev: 29b7129ffb7170fd40dffabaab258d2a4d45ede5

package:
  name: r-anispace
  version: ${{ version }}

source:
  git: https://github.com/animovement/anispace.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-anicore >=0.8.0
    - r-cli
    - r-dplyr
    - r-rlang
  run:
    - r-base >=4.1.0
    - r-anicore >=0.8.0
    - r-cli
    - r-dplyr
    - r-rlang

tests:
  - script:
      - Rscript -e "library(anispace)"

about:
  homepage: https://github.com/animovement/anispace
  summary: An R package providing spatial transformation methods for movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

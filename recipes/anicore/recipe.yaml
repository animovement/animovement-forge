schema_version: 1

context:
  version: "0.8.0.9003"
  rev: ddd0d2b3cf407994d0cb12133a921b664fc0fa6f

package:
  name: r-anicore
  version: ${{ version }}

source:
  git: https://github.com/animovement/anicore.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-cli
    - r-dplyr
    - r-rlang
    - r-pillar
    - r-anytime
    - r-lifecycle
  run:
    - r-base >=4.1.0
    - r-cli
    - r-dplyr
    - r-rlang
    - r-pillar
    - r-anytime
    - r-lifecycle

tests:
  - script:
      - Rscript -e "library(anicore)"

about:
  homepage: https://github.com/animovement/anicore
  summary: An R package providing core data structures for movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

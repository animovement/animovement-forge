schema_version: 1

context:
  version: "0.4.0"
  rev: 2a8bbe1a469781204eb57e3460aa3ad728e075dd

package:
  name: r-animetric
  version: ${{ version }}

source:
  git: https://github.com/animovement/animetric.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-aniframe
    - r-anispace
    - r-cli
    - r-dplyr
    - r-purrr
    - r-rlang
  run:
    - r-base >=4.1.0
    - r-aniframe
    - r-anispace
    - r-cli
    - r-dplyr
    - r-purrr
    - r-rlang

tests:
  - script:
      - Rscript -e "library(animetric)"

about:
  homepage: https://github.com/animovement/animetric
  summary: An R package for calculating movement-based metrics
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

schema_version: 1

context:
  version: "0.3.2"
  rev: 288036ea63fbced419e3b0883fba4ccfbee6b3f5

package:
  name: r-animetric
  version: ${{ version }}

source:
  git: https://github.com/animovement/animetric.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-aniframe
    - r-anispace
    - r-cli
    - r-dplyr
    - r-purrr
    - r-rlang
  run:
    - r-base >=4.1.0
    - r-aniframe
    - r-anispace
    - r-cli
    - r-dplyr
    - r-purrr
    - r-rlang

tests:
  - script:
      - Rscript -e "library(animetric)"

about:
  homepage: https://github.com/animovement/animetric
  summary: An R package for calculating movement-based metrics
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

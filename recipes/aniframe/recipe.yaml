schema_version: 1

context:
  version: "0.5.0"
  rev: f10ffed53057a00be0ddd69013f5b7b641c991be

package:
  name: r-aniframe
  version: ${{ version }}

source:
  git: https://github.com/animovement/aniframe.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script: R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-cli
    - r-dplyr
    - r-rlang
    - r-pillar
    - r-anytime
  run:
    - r-base >=4.1.0
    - r-cli
    - r-dplyr
    - r-rlang
    - r-pillar
    - r-anytime

tests:
  - script:
      - Rscript -e "library(aniframe)"

about:
  homepage: https://github.com/animovement/aniframe
  summary: An R package providing core data structures for movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

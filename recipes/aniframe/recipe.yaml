schema_version: 1

context:
  version: "0.6.0"
  rev: edcf710647b92be4ea45618a0bcb2d16f693db52

package:
  name: r-aniframe
  version: ${{ version }}

source:
  git: https://github.com/animovement/aniframe.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-cli
    - r-dplyr
    - r-rlang
    - r-pillar
    - r-anytime
    - r-lifecycle
  run:
    - r-base >=4.1.0
    - r-cli
    - r-dplyr
    - r-rlang
    - r-pillar
    - r-anytime
    - r-lifecycle

tests:
  - script:
      - Rscript -e "library(aniframe)"

about:
  homepage: https://github.com/animovement/aniframe
  summary: An R package providing core data structures for movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

schema_version: 1

context:
  version: "0.8.0"
  rev: c911640295367c8cce764f3cc51ff7e950e31d66

package:
  name: r-animovement
  version: ${{ version }}

source:
  git: https://github.com/animovement/animovement.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-anicore >=0.8.0
    - r-aniread
    - r-anispace
    - r-aniprocess
    - r-anicheck
    - r-animetric
    - r-anivis
    - r-cli
  run:
    - r-base >=4.1.0
    - r-anicore >=0.8.0
    - r-aniread
    - r-anispace
    - r-aniprocess
    - r-anicheck
    - r-animetric
    - r-anivis
    - r-cli

tests:
  - script:
      - Rscript -e "library(animovement)"

about:
  homepage: https://github.com/animovement/animovement
  summary: An R toolbox for analysing movement across space and time
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

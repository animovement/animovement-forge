schema_version: 1

context:
  version: "0.5.0"
  rev: 04118615ce8a911e9c3067ce18e795d4e2b9ae26

package:
  name: r-aniread
  version: ${{ version }}

source:
  git: https://github.com/animovement/aniread.git
  rev: ${{ rev }}

build:
  number: 0
  noarch: generic
  script:
    # Drop dev-only renv files from the git checkout; otherwise the
    # project .Rprofile activates renv and hijacks the library path.
    - rm -f .Rprofile renv.lock
    - rm -rf renv
    - R CMD INSTALL --no-multiarch --with-keep.source .

requirements:
  host:
    - r-base >=4.1.0
    - r-aniframe
    - r-cli
    - r-dplyr
    - r-janitor
    - r-rlang
    - r-stringr
    - r-tidyr
    - r-tidyselect
    - r-vroom
  run:
    - r-base >=4.1.0
    - r-aniframe
    - r-cli
    - r-dplyr
    - r-janitor
    - r-rlang
    - r-stringr
    - r-tidyr
    - r-tidyselect
    - r-vroom

tests:
  - script:
      - Rscript -e "library(aniread)"

about:
  homepage: https://github.com/animovement/aniread
  summary: An R package for reading and writing movement data
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol

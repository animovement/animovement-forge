name: Build and Upload

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # prefix.dev's trusted publishers are scoped to this environment, so the
    # job has to opt in for the OIDC token to carry the `environment` claim.
    # Without it the token matches no publisher and the mint request 401s.
    environment: prefix
    permissions:
      id-token: write  # required for prefix.dev trusted publishing
      contents: read

    steps:
      # Check out the branch tip (not the triggering SHA) so that when this
      # workflow is called by Nightly Check right after it pushes a version
      # bump, we build the freshly-committed recipe rather than the old one.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: prefix-dev/setup-pixi@v0.10.0

      - name: Build all packages
        run: |
          pixi run rattler-build build \
            --recipe-dir recipes \
            -c https://prefix.dev/animovement \
            -c conda-forge \
            --output-dir output

      - name: Upload to prefix.dev
        env:
          # Fallback for when trusted publishing (OIDC) is unavailable. Empty
          # when the secret isn't configured, in which case we unset it below
          # so the OIDC path is still tried.
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          # rattler-build reads PREFIX_API_KEY via clap; an empty value could
          # read as "key provided" and short-circuit trusted publishing.
          [ -n "$PREFIX_API_KEY" ] || unset PREFIX_API_KEY
          # Every build produces all 8 packages, but only changed versions are
          # new to the channel — --skip-existing ignores the rest. Unlike the
          # old grep-for-"already exists" loop, this still fails the job on
          # real errors such as an auth failure.
          find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \) -print0 \
            | xargs -0 --no-run-if-empty \
                pixi run rattler-build upload prefix \
                  --channel animovement \
                  --skip-existing

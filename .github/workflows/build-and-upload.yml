name: Build and Upload

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for prefix.dev trusted publishing
      contents: read

    steps:
      # Check out the branch tip (not the triggering SHA) so that when this
      # workflow is called by Nightly Check right after it pushes a version
      # bump, we build the freshly-committed recipe rather than the old one.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: prefix-dev/setup-pixi@v0.9.6

      - name: Build all packages
        run: |
          pixi run rattler-build build \
            --recipe-dir recipes \
            -c https://prefix.dev/animovement \
            -c conda-forge \
            --output-dir output

      - name: Upload to prefix.dev
        run: |
          # Every build produces all 8 packages, but only changed versions are
          # new to the channel. Skip packages that already exist (HTTP 409)
          # instead of failing the whole upload.
          set +e
          status=0
          while IFS= read -r pkg; do
            echo "Uploading $pkg ..."
            out=$(pixi run rattler-build upload prefix --channel animovement "$pkg" 2>&1)
            rc=$?
            echo "$out"
            if [ $rc -ne 0 ]; then
              if echo "$out" | grep -q "already exists"; then
                echo "  -> already on channel, skipping"
              else
                echo "  -> upload failed"
                status=1
              fi
            fi
          done < <(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \))
          exit $status

name: Nightly Check

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_updates: ${{ steps.update.outputs.has_updates }}

    steps:
      - uses: actions/checkout@v7

      - name: Check R-Universe for new versions
        id: update
        run: python scripts/update-recipes.py

      - name: Commit recipe updates
        if: steps.update.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add recipes/
          git commit -m "chore: update recipes from R-Universe [skip ci]"
          git push

  build:
    needs: check-and-update
    if: needs.check-and-update.outputs.has_updates == 'true'
    uses: ./.github/workflows/build-and-upload.yml
    permissions:
      id-token: write
      contents: read
    # Called workflows get no secrets by default, so PREFIX_API_KEY would be
    # empty here without this and only the OIDC path would be available.
    secrets: inherit

  notify-failure:
    needs: [check-and-update, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly recipe update/build failed"
          body="The [nightly run]($RUN_URL) failed. Recipes may have been bumped without a successful build/upload to prefix.dev — check the logs."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
